<head>

  <style>
    :root {
      --background: #f8f4ee;
      --text: #2b2118;
      --soft-text: #6f6257;
      --line: #d8cfc2;
      --card: #fffaf4;
      --accent: #8a6a4f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--background);
      color: var(--text);

      font-family: "Cormorant Garamond", Georgia, serif;
      text-align: center;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 20;

      padding: 12px 20px;

      background: rgba(248, 244, 238, 0.92);
      backdrop-filter: blur(8px);

      border-bottom: 1px solid var(--line);
    }

    nav a {
      display: inline-block;

      margin: 0 10px;

      color: var(--text);
      text-decoration: none;

      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a:hover {
      color: var(--accent);
    }

    .language-selector {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin-left: 12px;
      vertical-align: middle;
    }

    .language-selector button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 32px;
      padding: 5px 9px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: transparent;
      color: var(--text);

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
      transition: 0.2s;
    }

    .language-selector button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .language-selector button.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--background);
    }

    header {
      padding: 90px 24px 50px;
      border-bottom: 1px solid var(--line);
    }

    .small-label {
      margin-bottom: 18px;

      color: var(--soft-text);

      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: 56px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .subtitle {
      max-width: 680px;
      margin-top: 12px;
      margin-right: auto;
      margin-left: auto;

      color: var(--soft-text);

      font-size: 22px;
      line-height: 1.5;
    }

    section {
      padding: 70px 24px;
      border-bottom: 1px solid var(--line);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 16px;

      font-size: 38px;
      font-weight: normal;
    }

    p {
      max-width: 680px;
      margin: 0 auto 18px;

      font-size: 18px;
      line-height: 1.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;

      margin-top: 36px;
    }

    .gallery img {
      width: 100%;
      height: 360px;

      object-fit: cover;

      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.015);
      opacity: 0.92;
    }

    .empty-message {
      max-width: 680px;
      margin: 34px auto 0;
      padding: 28px;

      background: rgba(255, 255, 255, 0.35);
      border: 1px dashed var(--line);
      border-radius: 24px;

      color: var(--soft-text);

      font-size: 20px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;

      margin: 12px 8px;
      padding: 14px 28px;

      border: 1px solid var(--text);
      border-radius: 999px;

      color: var(--text);
      text-decoration: none;

      font-size: 15px;
      letter-spacing: 1px;

      transition: 0.2s;
    }

    .button:hover {
      background: var(--text);
      color: var(--background);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(0, 0, 0, 0.86);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;

      border-radius: 18px;
    }

    .close {
      position: fixed;
      top: 20px;
      right: 26px;

      color: white;

      font-size: 42px;
      line-height: 1;

      cursor: pointer;
    }

    footer {
      padding: 50px 24px;

      color: var(--soft-text);
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      nav {
        display: flex;
        justify-content: flex-start;
        align-items: center;

        overflow-x: auto;
        white-space: nowrap;

        padding: 10px 8px;
        scrollbar-width: none;
      }

      nav::-webkit-scrollbar {
        display: none;
      }

      nav a {
        flex: 0 0 auto;

        margin: 0 8px;

        font-size: 12px;
      }

      .language-selector {
        flex: 0 0 auto;

        margin-left: 6px;
        margin-right: 8px;
      }

      .language-selector button {
        min-height: 30px;
        padding: 4px 8px;
        font-size: 12px;
      }

      header {
        padding: 78px 18px 38px;
      }

      h1 {
        font-size: 40px;
        line-height: 1.1;
      }

      .subtitle {
        font-size: 18px;
      }

      section {
        padding: 50px 14px;
      }

      h2 {
        font-size: 32px;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .gallery img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 10px;
      }

      p {
        font-size: 17px;
      }

      .button {
        display: block;

        width: min(100%, 320px);
        margin: 12px auto;
      }
    }
  </style>

@media(prefers-reduced-motion:reduce) {html {scroll-behavior:auto;}}

<style id="estilo-paginacao">
.atalhos-albuns {display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:25px auto 0;}
.atalhos-albuns a,.paginacao-fotos button {padding:12px 18px; border:1px solid #d8cfc2; border-radius:24px; background:#fffaf4; color:#2b2118; text-decoration:none; font:inherit; min-height:44px;}
.atalhos-albuns a[aria-current="page"] {background:#2b2118; color:#fffaf4;}
.paginacao-fotos {display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; margin-top:30px; font-size:18px;}
.paginacao-fotos button {cursor:pointer;} .paginacao-fotos button:disabled {opacity:.4;cursor:default;}
#galeriaPaginada .abrir-foto {display:block; min-width:0; width:100%; padding:0; border:0; background:transparent; cursor:pointer;}
#galeriaPaginada .abrir-foto img {display:block; width:100%;}
.seta-paginada {position:absolute;top:50%;transform:translateY(-50%);width:44px;height:50px;background:#000a;color:white;border:1px solid #fff8;border-radius:10px;font-size:26px;cursor:pointer;z-index:102;}
.seta-paginada.anterior {left:8px;} .seta-paginada.proxima {right:8px;}
.contador-paginado {position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 15px;background:#000b;color:white;border-radius:20px;}
#albumFotos {scroll-margin-top:90px;}
@media(max-width:600px){#galeriaPaginada {grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}#galeriaPaginada img {height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;}.atalhos-albuns {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}.atalhos-albuns a {font-size:16px;}}
</style>
